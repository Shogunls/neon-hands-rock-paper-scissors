name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q main.py game_logic.py integrity.py
          python -m unittest discover -s tests -v
      - name: Project security policy
        run: python tools/security_check.py
      - name: Code quality
        run: |
          ruff check main.py game_logic.py integrity.py tests tools
          ruff format --check main.py game_logic.py integrity.py tests tools
      - name: Static security analysis
        run: bandit -q -r main.py game_logic.py integrity.py
      - name: Dependency vulnerability audit
        run: pip-audit --requirement requirements.txt
